<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>王者荣耀 · 全英雄克制链</title>
<style>
  :root{
    --gold:#e8c86a;
    --gold-2:#b8923a;
    --bg:#080a14;
    --panel:#121628;
    --panel-2:#171c33;
    --line:rgba(232,200,106,.16);
    --txt:#e9ecf7;
    --muted:#8b93ad;
    --top:#ef5350;
    --jungle:#a855f7;
    --mid:#4a90ff;
    --adc:#f0a63c;
    --support:#2fc47a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    color:var(--txt);
    background:
      radial-gradient(1100px 520px at 12% -10%, rgba(232,200,106,.13), transparent 60%),
      radial-gradient(900px 600px at 92% 0%, rgba(74,144,255,.14), transparent 62%),
      radial-gradient(800px 700px at 50% 110%, rgba(168,85,247,.10), transparent 65%),
      var(--bg);
    min-height:100vh;
    padding:26px 18px 60px;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 78%);
  }
  .wrap{max-width:1180px;margin:0 auto;position:relative;z-index:1}

  /* ---------- header ---------- */
  header{text-align:center;margin-bottom:26px}
  .brand{
    display:inline-flex;align-items:center;gap:10px;padding:5px 14px;border-radius:999px;
    border:1px solid var(--line);background:rgba(232,200,106,.06);
    font-size:12px;letter-spacing:.18em;color:var(--gold);margin-bottom:16px;
  }
  .brand i{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
  h1{
    font-size:clamp(26px,4.4vw,42px);font-weight:800;letter-spacing:.06em;line-height:1.15;
    background:linear-gradient(180deg,#fff6dc 0%,#f0d18a 42%,#c79c3f 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 18px rgba(232,200,106,.18));
  }
  .sub{margin-top:10px;font-size:13px;color:var(--muted);letter-spacing:.02em}
  .sub b{color:#cfd6ea;font-weight:600}
  .rule{width:210px;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--gold-2),transparent);opacity:.8}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin:22px 0 18px}
  .search{position:relative;flex:0 0 auto}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  #q{
    width:216px;padding:9px 12px 9px 34px;border-radius:10px;font-size:13.5px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);
    color:var(--txt);outline:none;transition:.2s;font-family:inherit;
  }
  #q::placeholder{color:#6d7491}
  #q:focus{border-color:rgba(232,200,106,.55);background:rgba(232,200,106,.06);box-shadow:0 0 0 3px rgba(232,200,106,.08)}

  .lanes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .lane{
    display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;cursor:pointer;
    font-size:13px;color:#b8c0d8;background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.08);transition:.18s;user-select:none;
  }
  .lane:hover{background:rgba(255,255,255,.07);color:#fff}
  .lane i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.8}
  .lane .num{font-size:11px;color:#7d85a0;font-variant-numeric:tabular-nums}
  .lane.on{background:rgba(232,200,106,.12);border-color:rgba(232,200,106,.55);color:#ffe6a8}
  .lane.on .num{color:#d9bf7a}
  .lane[data-lane="top"].on{background:rgba(239,83,80,.14);border-color:rgba(239,83,80,.6);color:#ffb3b1}
  .lane[data-lane="jungle"].on{background:rgba(168,85,247,.14);border-color:rgba(168,85,247,.6);color:#dcc4ff}
  .lane[data-lane="mid"].on{background:rgba(74,144,255,.14);border-color:rgba(74,144,255,.6);color:#b7d1ff}
  .lane[data-lane="adc"].on{background:rgba(240,166,60,.14);border-color:rgba(240,166,60,.6);color:#ffd39a}
  .lane[data-lane="support"].on{background:rgba(47,196,122,.14);border-color:rgba(47,196,122,.6);color:#a8ebc5}
  .lane[data-lane="top"] i{background:var(--top)}
  .lane[data-lane="jungle"] i{background:var(--jungle)}
  .lane[data-lane="mid"] i{background:var(--mid)}
  .lane[data-lane="adc"] i{background:var(--adc)}
  .lane[data-lane="support"] i{background:var(--support)}

  /* ---------- grid ---------- */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:12px;margin-top:6px;
  }
  @media(max-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:9px}}
  .card{
    position:relative;border-radius:11px;overflow:hidden;cursor:pointer;background:#101425;
    border:1px solid rgba(255,255,255,.07);
    transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s,border-color .18s;
    aspect-ratio:1/1;
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02);transition:transform .3s}
  .card::after{
    content:"";position:absolute;inset:auto 0 0 0;height:52%;
    background:linear-gradient(to top,rgba(5,7,14,.94),rgba(5,7,14,.55) 46%,transparent);
  }
  .card .nm{
    position:absolute;left:0;right:0;bottom:0;z-index:2;text-align:center;padding:0 4px 5px;
    font-size:12px;font-weight:600;letter-spacing:.02em;color:#f2f4fb;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 4px rgba(0,0,0,.9);
  }
  .card .bar{position:absolute;top:0;left:0;right:0;height:2.5px;z-index:2;opacity:.85}
  .card.l-top .bar{background:linear-gradient(90deg,transparent,var(--top),transparent)}
  .card.l-jungle .bar{background:linear-gradient(90deg,transparent,var(--jungle),transparent)}
  .card.l-mid .bar{background:linear-gradient(90deg,transparent,var(--mid),transparent)}
  .card.l-adc .bar{background:linear-gradient(90deg,transparent,var(--adc),transparent)}
  .card.l-support .bar{background:linear-gradient(90deg,transparent,var(--support),transparent)}
  .card:hover{transform:translateY(-4px);border-color:rgba(232,200,106,.65);box-shadow:0 10px 26px -8px rgba(0,0,0,.85),0 0 0 1px rgba(232,200,106,.25),0 0 22px -6px rgba(232,200,106,.45)}
  .card:hover img{transform:scale(1.09)}
  .card.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,200,106,.55),0 0 24px -4px rgba(232,200,106,.5)}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 0;font-size:14px}

  /* ---------- modal ---------- */
  .mask{
    position:fixed;inset:0;background:rgba(3,5,12,.78);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:100;
  }
  .mask.show{display:flex;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    width:100%;max-width:880px;max-height:86vh;overflow:auto;position:relative;
    background:linear-gradient(165deg,#141931 0%,#0e1223 60%,#101528 100%);
    border:1px solid rgba(232,200,106,.28);border-radius:18px;
    box-shadow:0 40px 90px -30px #000,0 0 0 1px rgba(255,255,255,.03) inset;
    animation:pop .22s cubic-bezier(.2,.9,.3,1);
    scrollbar-width:thin;scrollbar-color:#3a4160 transparent;
  }
  .modal::-webkit-scrollbar{width:9px}
  .modal::-webkit-scrollbar-thumb{background:#2f3654;border-radius:9px;border:2px solid #0e1223}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  .modal::before{
    content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.8;
  }
  .mhead{display:flex;gap:16px;align-items:center;padding:24px 26px 18px;position:relative}
  .mhead .ava{
    width:78px;height:78px;border-radius:14px;overflow:hidden;flex:0 0 auto;position:relative;
    border:2px solid rgba(232,200,106,.7);box-shadow:0 0 22px -4px rgba(232,200,106,.55);
  }
  .mhead .ava img{width:100%;height:100%;object-fit:cover;display:block}
  .mhead .mt{min-width:0}
  .mhead h2{font-size:26px;font-weight:800;letter-spacing:.03em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .mhead .title{font-size:12.5px;color:#9199b4;margin-top:5px;letter-spacing:.04em}
  .badge{
    font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.05em;
    border:1px solid currentColor;opacity:.95;
  }
  .b-top{color:var(--top);background:rgba(239,83,80,.10)}
  .b-jungle{color:var(--jungle);background:rgba(168,85,247,.10)}
  .b-mid{color:var(--mid);background:rgba(74,144,255,.10)}
  .b-adc{color:var(--adc);background:rgba(240,166,60,.10)}
  .b-support{color:var(--support);background:rgba(47,196,122,.10)}
  .x{
    position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    color:#98a0ba;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);
    transition:.16s;font-size:19px;line-height:1;
  }
  .x:hover{color:#fff;background:rgba(255,255,255,.12);transform:rotate(90deg)}
  .body{padding:2px 26px 26px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:680px){.cols{grid-template-columns:1fr;gap:16px}}
  .col h3{
    display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.04em;
    padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07);
  }
  .col h3 span.c{font-size:11px;font-weight:600;color:#8d95b0;background:rgba(255,255,255,.06);padding:1px 7px;border-radius:999px}
  .col.win h3{color:#4ade80}
  .col.lose h3{color:#f87171}
  .row{
    display:flex;gap:11px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;
    border:1px solid transparent;transition:.15s;margin-bottom:7px;background:rgba(255,255,255,.028);
  }
  .row:hover{background:rgba(232,200,106,.09);border-color:rgba(232,200,106,.35);transform:translateX(2px)}
  .row img{width:42px;height:42px;border-radius:9px;object-fit:cover;flex:0 0 auto;background:#0b0e1a}
  .row .tx{min-width:0}
  .row .rn{font-size:13.5px;font-weight:650;color:#eef1fa;letter-spacing:.01em}
  .row .rr{font-size:11.5px;color:#8f97b2;margin-top:2px;line-height:1.45}
  .col .none{font-size:12.5px;color:#6e7590;padding:14px 4px;line-height:1.7}
  .foot{
    margin-top:20px;padding-top:14px;border-top:1px solid rgba(255,255,255,.06);
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-size:11.5px;color:#6f7794;letter-spacing:.02em;
  }
  .dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .dot.g{background:#4ade80}.dot.r{background:#f87171}

  /* ---------- footer ---------- */
  .page-foot{text-align:center;margin-top:34px;font-size:11.5px;color:#5f6784;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><i></i>HONOR OF KINGS · COUNTER CHAIN</div>
    <h1>王者荣耀 · 全英雄克制链</h1>
    <p class="sub">收录 <b id="heroCount">0</b> 位英雄 · 点击头像查看克制关系 · 图标本地内置，断网可用</p>
    <div class="rule"></div>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9aa2bd" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="搜索英雄…" autocomplete="off" spellcheck="false">
    </div>
    <div class="lanes" id="lanes"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="page-foot">
    克制关系按对线与团战经验整理，仅供参考 · 英雄图标来自王者荣耀官方素材<br>
    数据只在本文件内，不联网、不上传
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="mhead">
      <div class="ava"><img id="mAva" alt=""></div>
      <div class="mt">
        <h2><span id="mName"></span><span class="badge" id="mBadge"></span></h2>
        <div class="title" id="mTitle"></div>
      </div>
      <div class="x" id="mClose" title="关闭">×</div>
    </div>
    <div class="body">
      <div class="cols">
        <div class="col win">
          <h3>优势对局 · 我克制 <span class="c" id="cWin">0</span></h3>
          <div id="listWin"></div>
        </div>
        <div class="col lose">
          <h3>劣势对局 · 克制我 <span class="c" id="cLose">0</span></h3>
          <div id="listLose"></div>
        </div>
      </div>
      <div class="foot">
        <span><i class="dot g"></i>点击任意头像可直接切换到该英雄的克制链</span>
        <span>ESC 关闭</span>
      </div>
    </div>
  </div>
</div>

function buildLanes(){
  const defs=[['all','全部'],['top','对抗路'],['jungle','打野'],['mid','中路'],['adc','发育路'],['support','游走']];

    el.onclick=()=>{

    };

  list.forEach(h=>{
    const d=document.createElement('div');
    d.className=`card l-${h.l}`+(curHero&&curHero.n===h.n?' active':'');
    d.dataset.name=h.n;
    d.innerHTML=`<div class="bar"></div><img src="${h.img}" alt="${h.n}" loading="lazy" decoding="async"><div class="nm">${h.n}</div>`;
    d.onclick=()=>openHero(h.n);
    frag.appendChild(d);
  });
  grid.innerHTML='';
  grid.appendChild(frag);
}

const mask=document.getElementById('mask');
function row(item){
  return `<div class="row" data-name="${item.h.n}">
    <img src="${item.h.img}" alt="${item.h.n}" loading="lazy" decoding="async">
    <div class="tx"><div class="rn">${item.h.n}</div><div class="rr">${item.r}</div></div>
  </div>`;
}
function openHero(name){
  const h=byName[name];
  if(!h) return;
  curHero=h;
  document.getElementById('mAva').src=h.img;
  document.getElementById('mAva').alt=h.n;
  document.getElementById('mName').textContent=h.n;
  const badge=document.getElementById('mBadge');
  badge.textContent=LANE[h.l][0];
  badge.className='badge b-'+h.l;
  document.getElementById('mTitle').textContent=h.t?('「'+h.t+'」'):'';
  const w=wins[h.n], l=loses[h.n];
  document.getElementById('cWin').textContent=w.length;
  document.getElementById('cLose').textContent=l.length;
  document.getElementById('listWin').innerHTML=w.length?w.map(row).join(''):'<div class="none">暂无记录</div>';
  document.getElementById('listLose').innerHTML=l.length?l.map(row).join(''):'<div class="none">暂无记录</div>';
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',c.dataset.name===h.n));
  mask.classList.add('show');
  document.getElementById('modal').scrollTop=0;
  document.querySelectorAll('#listWin .row,#listLose .row').forEach(r=>{
    r.onclick=()=>openHero(r.dataset.name);
  });
}
function closeHero(){
  mask.classList.remove('show');
  curHero=null;
  document.querySelectorAll('.card.active').forEach(c=>c.classList.remove('active'));
}

document.getElementById('mClose').onclick=closeHero;
mask.onclick=e=>{if(e.target===mask) closeHero();};
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeHero();});
q.oninput=render;

document.getElementById('heroCount').textContent=HEROES.length;
buildLanes();
render();
</script>
</body>
</html>
